[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxide-triage"
version = "0.1.0"
description = "Deterministic triage assistant for oxide dielectric thin-film candidates. LLM only at the edges."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
app = ["oxide-triage[web]"]
llm = ["anthropic>=1.0", "zstandard>=0.23"]  # zstandard: httpx2 needs a current decompressor
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]
all = ["oxide-triage[web,llm,mcp,dev]"]

[project.scripts]
oxide-triage = "oxide_triage.cli:app"
oxide-triage-mcp = "oxide_triage.mcp_server:main"

[tool.setuptools.packages.find]
include = ["oxide_triage*"]

[tool.setuptools.package-data]
oxide_triage = ["templates/*.j2", "data/*.yaml", "data/fixtures/*.json", "prompts/*.md", "ui/dist/*", "ui/dist/assets/*"]

[tool.ruff]
line-length = 110
extend-exclude = ["*.ipynb"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long regex and f-string literals; ruff format handles the rest

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
"oxide_triage/cli.py" = ["B008"]  # typer.Option defaults are the documented pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
