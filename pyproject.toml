[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxide-triage"
version = "0.1.0"
description = "Deterministic triage assistant for oxide dielectric thin-film candidates. LLM only at the edges."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
all = ["oxide-triage[app,llm,dev]"]

[project.scripts]
oxide-triage = "oxide_triage.cli:app"

[tool.setuptools.packages.find]
include = ["oxide_triage*"]

[tool.setuptools.package-data]
oxide_triage = ["templates/*.j2", "data/*.yaml", "data/fixtures/*.json", "prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
