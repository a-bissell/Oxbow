# Base deployment: the app with a persistent cache volume and no language model.
#
#   cp .env.example .env            # add MP_API_KEY (and OPENALEX_MAILTO)
#   docker compose -f docker/compose.yml up --build
#   docker compose -f docker/compose.yml run --rm app oxide-triage warm-cache
#   open http://localhost:8501
#
# Everything the site admin edits lives in ./config (mounted read-only) and .env.
name: oxide-triage

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: oxide-triage:latest
    env_file:
      - ../.env
    environment:
      OXIDE_TRIAGE_CACHE: /data/cache.sqlite
      # LLM_PROVIDER defaults to `none`: the system is fully functional without a model.
      # The Agent page needs a provider: `LLM_PROVIDER=anthropic docker compose ...` with
      # ANTHROPIC_API_KEY in .env, or the compose.local-llm.yml overlay. This line beats the
      # env_file, so the variable must be set in the shell that runs compose.
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
    volumes:
      - cache:/data
      - ../config:/app/config:ro
    ports:
      - "${OXIDE_TRIAGE_PORT:-8501}:8501"
    restart: unless-stopped

  # MCP endpoint for Claude Desktop / Cowork / Cursor over the network (streamable HTTP).
  # Desktop apps on the same machine can instead launch `oxide-triage mcp` over stdio; see
  # docker/mcp-client-config.example.json.
  mcp:
    image: oxide-triage:latest
    command: ["oxide-triage", "mcp", "--transport", "http", "--host", "0.0.0.0", "--port", "8765"]
    env_file:
      - ../.env
    environment:
      OXIDE_TRIAGE_CACHE: /data/cache.sqlite
      OXIDE_TRIAGE_OFFLINE: ${OXIDE_TRIAGE_OFFLINE:-0}
      LLM_PROVIDER: none          # the MCP client's own model is the front edge
    volumes:
      - cache:/data
      - ../config:/app/config:ro
    ports:
      - "127.0.0.1:${OXIDE_TRIAGE_MCP_PORT:-8765}:8765"   # loopback; put a reverse proxy with auth in front for LAN use
    depends_on:
      - app
    restart: unless-stopped

volumes:
  cache:
