# The WIDE cation list: every plausible oxide-forming cation. Not the default. Select it with
# candidates.cation_allowlist_file: cation_allowlist_wide.yaml in a profile that wants alkali,
# late-transition-metal, pnictide or chalcogenide oxides in the universe (the warm is several
# times larger). Elements permitted as cations when pulling the oxide candidate universe from
# Materials Project. Oxygen must be the *only* anion: compounds containing F, Cl, Br,
# I, S, Se (as anion), N, H or C are not oxides in the sense this tool means and are
# excluded by construction. Hazardous elements are included here on purpose: the
# hazard screen (element_hazards.yaml) decides whether they pass, and a profile may
# legitimately allow them. Keeping them in the universe means "include lead" is a
# configuration change, not a re-fetch.
version: "2026-09-09.1"
cations:
