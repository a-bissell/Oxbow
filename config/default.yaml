# Oxide Triage — base configuration.
# Every knob a site admin may want to turn lives here. Profiles in config/profiles/
# are partial overrides deep-merged onto this file.
#
# Units: energies in eV/atom, band gaps in eV; the figure of merit's units are declared in its block.

profile_name: default
description: >
  Balanced defaults for oxide dielectric triage. Wide-gap, stable, non-toxic, simple,
  with public literature evidence.

# ---------------------------------------------------------------------------
# Criterion weights (relative; normalised to sum 1.0 at load time, together with
# figure_of_merit.weight below). These six criteria are the same for any material class.
# ---------------------------------------------------------------------------
weights:
  stability: 0.25
  band_gap: 0.25
  interface: 0.15                 # stability in contact with the substrate (see `interface:` below)
  toxicity: 0.15
  simplicity: 0.10
  literature: 0.10

# ---------------------------------------------------------------------------
# Hard gates. A candidate failing any gate is excluded (listed in the audit view
# with the reason). on_missing controls what happens when the gate cannot be
# evaluated because the value is absent: exclude | flag
# ---------------------------------------------------------------------------
gates:
  max_energy_above_hull_ev_atom: 0.05
  min_band_gap_ev: 4.0          # applied to the *effective* (possibly corrected) gap
  max_elements: 3
  on_missing_stability: exclude
  on_missing_band_gap: exclude

# ---------------------------------------------------------------------------
# Band gap handling. DFT (PBE/GGA) gaps underestimate experiment by ~30-50%.
# strategy: none | scalar_factor | hse_preferred
#   none           use the reported value, whatever functional produced it
#   scalar_factor  multiply GGA/GGA+U/r2SCAN values by scalar_factor; HSE untouched
#   hse_preferred  use HSE where reported; otherwise apply `fallback`
# The functional behind every value is recorded and displayed. Corrected values are
# always labelled as corrected.
# ---------------------------------------------------------------------------
band_gap:
  correction:
    strategy: hse_preferred
    scalar_factor: 1.4
    fallback: scalar_factor     # used by hse_preferred when no HSE value: scalar_factor | none
  hybrid_functionals: [HSE06, HSE, PBE0, B3LYP]   # treated as "already accurate"
  preference:
    ideal_ev: 5.5               # normalized score reaches 1.0 here (effective gap)
    # score is 0 at gates.min_band_gap_ev and rises linearly to 1 at ideal_ev.
    # ~5.5 eV already gives >1 eV band offsets to Si; beyond that the marginal benefit is
    # small, and a steeper curve over-rewards differences inside the correction's error bar.

stability:
  zero_score_at_ev_atom: 0.10   # E_hull at which the stability score reaches 0
  cross_check_tolerance_ev_atom: 0.05   # |MP - OQMD| hull distance within this = agree
  agreement_bonus: 0.10
  disagreement_penalty: 0.15

# ---------------------------------------------------------------------------
# The application figure of merit: the one criterion that says what the profile ranks *for*.
# The other six criteria are the same for any material class; a profile for another class
# replaces this block (see config/profiles/thermal-barrier.yaml). The dielectric constant is
# one instance of it, not a special case in the code.
# ---------------------------------------------------------------------------
figure_of_merit:
  criterion: dielectric         # its name in the weights, the audit view, caveat codes and requests
  label: dielectric constant
  units: ""                     # dimensionless
  property: e_total             # the field of the provider's record that is scored
  provider: mp_dielectric       # Materials Project DFPT dielectric tensors (oxide_triage/sources/properties.py)
  method: DFPT                  # shown beside every value, as the functional is shown beside a band gap
  prefer: high
  low: 8.0                      # e_total at/below this scores 0 (SiO2 ~4, Al2O3 ~10)
  high: 30.0                    # e_total at/above this scores 1 (HfO2/ZrO2 ~20-25 land mid-high)
  # Saturating at ~30 is deliberate: for thin-film gate stacks k of 20-30 is the useful range and
  # much larger k correlates with small gaps and ferroelectric/paraelectric instability.
  weight: 0.15
  on_missing: flag              # flag: not scored, coverage reduced, caveated | exclude: a hard gate
  # Words a request may use for this criterion ("prioritise the dielectric constant") and that the
  # guard counts as an in-scope ask. Regular-expression alternatives.
  vocabulary: ["dielectric", "permittivit\\w*", "high[- ]?k", "kappa"]
  # What the profile ranks for; the guard says so when a request names another application.
  application: "a gate dielectric (stability, band gap, permittivity, interface with the substrate)"

toxicity:
  table_file: element_hazards.yaml
  tier_scores: {0: 1.0, 1: 0.5, 2: 0.0}
  blocklist_tiers: [2]          # elements in these tiers fail the hazard gate
  element_blocklist: []         # extra elements to block regardless of tier
  element_allowlist: []         # elements to permit despite tier (surfaced as a deviation)
  # Elements a request can never unblock, whoever asks. Lead can be lifted by a request with
  # confirmation because a ferroelectrics group has a real reason; nothing on this list can.
  # A site changes it in site.yaml (an admin decision, logged as a site override), not in a
  # request. Shipped: every radioactive element in the hazard table.
  never_lift: [U, Th, Ra, Ac, Pa, Np, Pu, Am, Cm, Po]

simplicity:
  scores: {2: 1.0, 3: 0.6, 4: 0.3, 5: 0.1}   # by number of distinct elements

interface:
  # Thermodynamic stability of the oxide in contact with the substrate, from the convex hull of
  # the oxide's elements plus the substrate's (Hubbard & Schlom, J. Mater. Res. 11, 2757 (1996);
  # the screening that explains why HfO2 became the gate oxide). The hull comes from Materials
  # Project's thermo data, cached per element system. Score 1 when no reaction lowers the energy,
  # 0 at zero_score_at_ev_atom: HfO2, Al2O3, Y2O3 and LaAlO3 are at 0 eV/atom against Si; ZrO2
  # is marginal (-0.03); Ta2O5 (-0.28), TiO2 (-0.15) and Nb2O5 (-0.50) react. Bulk thermodynamics
  # only: kinetics, interlayers and epitaxy are not modelled.
  substrate: Si                   # an element or a hull-phase formula (Ge, SrTiO3, ...)
  # DFT formation energies carry errors of a few tens of meV/atom, so a reaction less exothermic
  # than the tolerance is treated as no reaction: ZrO2 against Si comes out at -0.03 to -0.07
  # depending on the functional, and Hubbard & Schlom classed it stable. The score falls from 1
  # at -tolerance to 0 at -(tolerance + zero_score_at_ev_atom). The caveat threshold below is
  # separate and smaller, so a marginal case is still flagged in words.
  tolerance_ev_atom: 0.05
  zero_score_at_ev_atom: 0.20
  caveat_below_ev_atom: 0.02      # a reaction more exothermic than this gets a caveat naming the products
  thermo_type: GGA_GGA+U_R2SCAN   # MP thermo scheme; matches the summary formation energies

literature:
  # The brief says "prefer public evidence", so the curve must still separate well-studied
  # compounds from thinly studied ones among candidates that pass everything else. Saturating at
  # 50 thin-film works (the first setting) gave HfO2 with 6,975 and LaScO3 with 29 the same score;
  # at 500 the log curve still rewards the incumbents without making the count the whole ranking.
  thin_film_saturation: 500     # thin-film works at which the sub-score saturates (log curve)
  total_saturation: 5000
  thin_film_weight: 0.7         # remainder goes to total works

# How an UNKNOWN criterion affects ranking. It is always displayed as unknown (never as
# zero) and always lowers the confidence label. For the ranking arithmetic:
#   no_credit    the unknown criterion earns no contribution; adjusted = raw*coverage - penalty*(1-coverage)
#                A candidate can never outrank another by having *less* data. (default)
#   renormalize  score over the criteria that have data only; adjusted = raw - penalty*(1-coverage)
#                Warning: with this policy a candidate missing a criterion it would have
#                scored poorly on is *helped* by the gap. The known-answer evaluation
#                caught exactly this during development; kept as an option for comparison.
missing_data:
  policy: no_credit
  penalty: 0.05
  confidence_thresholds: {high: 0.9, medium: 0.6}

# ---------------------------------------------------------------------------
# Candidate universe (what is pulled from Materials Project into the cache)
# ---------------------------------------------------------------------------
candidates:
  # cation_allowlist.yaml is the dielectric-minded list (rationale per family inside the file);
  # cation_allowlist_wide.yaml is the original wide list for profiles that want it.
  cation_allowlist_file: cation_allowlist.yaml
  max_elements_query: 3
  # Experimentally observed structures only (MP theoretical: false). On the first live warm this
  # removed 40% of the universe and a third of the dielectric-bearing entries, nearly all
  # hypothetical polymorphs. The group will deposit films of what comes out, so a structure
  # nobody has synthesised is a discovery target, not a triage candidate.
  observed_only: true
  # Where the formula-keyed sources (OQMD, PubChem, OpenAlex) are fetched. Materials Project
  # warms in minutes; OQMD answers an uncached composition in 10-50 s and OpenAlex meters a
  # daily budget ($0.10/day per IP, $1/day with a free key, $0.001 per search, two per
  # formula), so warming them for thousands of formulas takes hours to days. on_demand: the
  # warm fetches MP only, and each query fills the top-ranked pool, re-ranking until the pool
  # is settled; candidates below the pool carry no cross-check, literature or compound-hazard
  # data and the output says so. warm: fetch them for every formula during warm-cache.
  formula_sources: on_demand
  on_demand_pool: 25            # ranked candidates filled per query, never fewer than top_k
  # The first live warm at 0.20 eV/atom and 1.0 eV pulled 7,124 candidates. No shipped profile
  # gates above 0.08 eV/atom or below 2.5 eV effective (1.8 eV before a 1.4x correction), so
  # anything outside these bounds could never be ranked. Widen them if you add a looser profile.
  energy_above_hull_ceiling_ev_atom: 0.10
  min_reported_gap_ev: 1.8
  literature_sample_size: 5
  fetch_workers: 4          # concurrent requests per source during warm-cache (0 = sequential)
  # Per-source overrides. workers: threads for that source's pool; max_rps: requests per second
  # across all of its threads, retries included. OQMD returned 429 at ~2.4 req/s and answers a
  # composition it has not cached in 10-50 s, so it needs a low rate cap *and* a deep pool: the
  # cap bounds the pressure, the pool keeps throughput near the cap despite the latency.
  # PubChem documents 5 req/s; OpenAlex allows 10 req/s but is metered by budget, not rate;
  # Materials Project is batched (100 ids per call) and needs no cap.
  # pause_after / pause_s: after that many consecutive server failures (5xx, transport errors)
  # the source is paused for pause_s and its requests fail at once; default 5 and 60. OQMD
  # answered 502 to everything for a stretch of one release warm, and without the pause every
  # formula spent three retries on it.
  fetch:
    oqmd:     {workers: 8, max_rps: 1.0, pause_after: 5, pause_s: 60}
    pubchem:  {workers: 4, max_rps: 4.0}
    openalex: {workers: 4, max_rps: 5.0}

output:
  default_template: pi_summary   # pi_summary | audit | json
  top_k: 5
  verbosity: normal              # terse | normal | verbose
  # One shortlist row per compound. Materials Project holds several phases of many oxides
  # (monoclinic and tetragonal HfO2, ...) and each passes the gates on its own, so without
  # grouping one compound can fill three rows. The best-ranked phase leads the row; the other
  # passing phases are listed under it with their own hull distance, gap and score, and a
  # caveat says which phase a film adopts is not modelled. Set false to rank materials.
  group_polymorphs: true
  # Scores closer than this are a tie, not an order: DFT gaps, DFPT dielectric constants and
  # log-scaled literature counts do not support ranking two candidates 0.02 apart. The shortlist
  # is printed in tiers (each tier is the candidates within tie_band of its leader) and a rank
  # inside a tier is shown but should be read as arbitrary. 0 turns tiering off.
  tie_band: 0.04

# Site-local vocabulary -> canonical terms understood by the parser
terminology:
  high-k: dielectric
  hi-k: dielectric
  hafnia: HfO2
  zirconia: ZrO2
  alumina: Al2O3
  silica: SiO2
  magnesia: MgO
  yttria: Y2O3
  tantala: Ta2O5
  titania: TiO2
  stable: thermodynamically stable

cache:
  path: data/cache.sqlite
  ttl_days: 90
  offline: false

# ---------------------------------------------------------------------------
# LLM edges. provider: none | anthropic | openai_compatible
# The deterministic core never sees the model. With provider=none the whole system
# still runs: a rule-based parser handles the front edge and templates the back edge.
# openai_compatible is OpenAI's API (OPENAI_API_KEY) unless base_url (LLM_BASE_URL) names a
# vLLM / Ollama / llama.cpp server; then model (LLM_MODEL) is the served model's name.
# ---------------------------------------------------------------------------
llm:
  provider: none
  model: null
  base_url: null
  timeout_s: 60
  use_for:
    parse: true      # natural-language request -> Criteria (validated)
    refute: true     # elaborate rule-derived caveats over structured facts
    rationale: false # one-line plain-language rationale per candidate (numeric-guarded)

# ---------------------------------------------------------------------------
# Chat agent (the web assistant and `oxide-triage chat`). The model drives the same
# tools the MCP server exposes; every number, rank and citation comes out of a tool. Needs
# llm.provider to be anthropic or openai_compatible. Nothing here affects ranking.
# ---------------------------------------------------------------------------
server:
  # The web app records who caused each deviation from the name the authenticating reverse
  # proxy puts in this header. Without a proxy the actor is logged as "unattributed".
  actor_header: X-Forwarded-User

agent:
  model: null               # assistant model; null = claude-sonnet-5 for anthropic (AGENT_MODEL overrides)
  max_tool_rounds: 8        # tool-call rounds allowed per user message
  number_guard: flag        # flag | off: mark numbers in a reply that no tool output contains
  max_tokens: 16000         # per model reply
  timeout_s: 300            # separate from llm.timeout_s; thinking can pause before the first byte
  tool_result_max_chars: 20000  # tool output passed to the model (the report panel shows it all)

# Retrieval completeness. Missing data lowers a score, so on a partly-warmed cache the
# ranking partly reflects which fetches finished rather than which materials are better.
# These floors decide when the system says so, and when it refuses to rank at all.
retrieval:
  min_completeness_warn: 0.95   # below this fraction of retrieved scoring weight, warn on every result
  min_completeness_serve: 0.0   # below this, refuse to serve a ranking (0.0 disables the block)

# ---------------------------------------------------------------------------
# Self-check: the known-answer test the system runs on itself after every cache warm,
# fixture load or on-demand material addition. Workhorse dielectrics must surface near the
# top of an unconstrained run or be excluded by a stated gate; a workhorse missing from the
# candidate universe is a failure. on_failure: block (serve no shortlist) | warn (banner)
# ---------------------------------------------------------------------------
selfcheck:
  enabled: true
  on_failure: block
  min_retrieval_completeness: 0.9   # below this, the known-answer check reports insufficient_data, not FAIL
  workhorses: [HfO2, ZrO2, Al2O3, Ta2O5]
  # Each workhorse must rank in the upper half of the passing compounds unless the interface
  # criterion explains the drop: Ta2O5 reacts with Si (-0.30 eV/atom on the hull), which is why it
  # is a capacitor dielectric on TiN rather than a gate oxide, and the check says so by name.
  # Leaders must sit in the default top leaders_top_n. Al2O3 is a workhorse but not a leader:
  # its dielectric constant (~10) sits at the bottom of the dielectric preference, so under a
  # dielectric-weighted default it lands around 16th of ~500, correctly.
  leaders: [HfO2]
  # Rank windows. On the first live warm the default top five were SrHfO3, LaAlO3, LaScO3, CaZrO3
  # and ScTaO4 (k of 25-49), with HfO2 6th, ZrO2 7th and Al2O3 16th of 497: a correct ranking
  # for the request, since the dielectric curve saturates at k=30. The windows pass that and
  # still fail on a workhorse that vanished from the universe or sank below the median.
  leaders_top_n: 10
  wide_top_n: 25                    # under the exploratory profile ...
  min_workhorses_in_wide_top: 2     # ... at least this many workhorses in that window

# ---------------------------------------------------------------------------
# Adaptive acquisition: after a cache warm, gaps in the retrieved data (no OQMD match, no
# literature counts, unresolved functional) are attacked with alternative read-only routes
# (chemical-system query, common-name search, refetch). A model may ORDER the allowed routes
# for a gap (planner: llm) but can never add a route or supply a value; the default ladder is
# deterministic. Gaps with no public route (DFPT dielectric) are reported as unfillable.
# ---------------------------------------------------------------------------
acquisition:
  enabled: true
  budget: 200            # maximum route attempts per pass
  planner: ladder        # ladder | llm
